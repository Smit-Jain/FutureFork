# Alembic configuration for FutureFork.
#   alembic upgrade head          apply all migrations to $DATABASE_URL (read from .env)
#   alembic revision -m "..."     create a new migration in backend/db/migrations/versions
# The backend also runs `upgrade head` on startup (backend/db/repository.py:init_db).

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
path_separator = os
# The database URL comes from DATABASE_URL (see backend/db/migrations/env.py), not from this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
